<!DOCTYPE html>

<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h2>Login</h2>


    <form onsubmit="login(); return false;">

        <input 
            id="email"
            type="email"
            placeholder="Email"
            required
        >


        <input 
            id="password"
            type="password"
            placeholder="Password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <script src="app.js"></script>

</body>

</html>
